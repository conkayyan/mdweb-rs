title = "My Blog"
base_url = "http://localhost:8080"
author = "Jane Doe"
language = "en"
languages = ["en", "zh"]
theme = "default"

# Routing rules — URL slugs for the well-known, non-content routes. Each value
# renames that route everywhere: the server, generated links, the footer/theme
# templates and the feed/sitemap/search-index URLs all pick up the new value.
# `posts`/`pages` rename the URL prefixes of `content/posts/` and
# `content/pages/`; the on-disk layout stays as-is.
# These are the defaults; uncomment to change, or delete the whole block to
# fall back to them implicitly.
[routes]
search       = "search"        # search page:          /search  (/<lang>/search)
tags         = "tags"          # tags index + listing: /tags/   (/<lang>/tags/<tag>/)
rss          = "rss.xml"       # RSS feed:             /rss.xml (/<lang>/rss.xml)
sitemap      = "sitemap.xml"   # XML sitemap:          /sitemap.xml
search_index = "search.json"   # client-side search:   /search.json
static       = "static"        # theme assets:         /static/...
posts        = "posts"         # blog container:       content/posts/... → /posts/...
pages        = "pages"         # pages container:      content/pages/... → /pages/...

# Syndication: toggle visibility of the RSS feed and sitemap links in the
# footer. Both default to `true`; flip to `false` to hide.
show_rss = true
show_sitemap = true

# Listing limits. Set `0` to disable pagination for that listing.
home_limit = 5       # articles per page on /
category_limit = 5   # articles per page in category landings
pages_limit = 50     # pages per page in a directory landing
tags_limit = 10      # articles per page on a /tags/<tag>/ landing

# Tag cloud: show the tag widget in the sidebar (true) or hide it (false).
show_tag_cloud = true
tag_cloud_limit = 0   # max tags in the sidebar cloud; 0 = show all

# Analytics — leave commented out (or `id = ""`) to disable. When `id` is
# non-empty, the matching tracker JS is auto-injected into the page <head>
# before any content from `template/<theme>/layout/inject.html`. Currently
# supported providers: `google` (gtag.js) and `baidu` (Baidu Tongji).
#
# [analytics.google]
# id = "G-XXXXXXXXXX"
#
# [analytics.baidu]
# id = "XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"

# Security response headers — on by default. Every response carries
# `X-Content-Type-Options: nosniff`, `X-Frame-Options: SAMEORIGIN`,
# `Referrer-Policy: no-referrer` and a Content-Security-Policy tuned for the
# default themes + analytics. `enabled = false` turns them all off; `csp`
# replaces the built-in policy (empty string omits the CSP header entirely).
#
# [security]
# enabled = true
# csp = "default-src 'self'; frame-ancestors 'self'"

[lang.en]
title = "My Blog"
display_name = "English"
description = "A demo site built with mdweb."
keywords = "blog, rust"

[lang.zh]
title = "我的博客"
display_name = "简体中文"
description = "使用 mdweb 构建的演示站点，支持多语言。"
keywords = "博客, rust"

