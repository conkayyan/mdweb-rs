{% extends "base.html" %}
{% block title %}{{ article.title }} · {{ title }}{% endblock title %}
{% block content %}
<article class="post">
  <h1 class="post-title">{{ article.title }}</h1>
  {% if article.reading_minutes %}<p class="reading-time">{{ article.reading_minutes }} {{ t.reading_time }}</p>{% endif %}
  <div class="post-content">{{ article.content | safe }}</div>
</article>
{% endblock content %}
